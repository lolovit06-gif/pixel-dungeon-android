name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot Android environment
        run: |
          echo "HOME=$HOME"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config/godot"

          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi

          echo "Installed export templates:"
          ls -la "$HOME/.local/share/godot/export_templates" || true

          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          sed -i '/^export\/android\/java_sdk_path =/d' "$SETTINGS"
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"

          echo "HOME=$HOME"
          echo "Java:"
          java -version
          echo "Java SDK directory:"
          test -d /usr/lib/jvm/java-17-openjdk-amd64
          echo "Android SDK environment:"
          env | grep -E '^(ANDROID_HOME|ANDROID_SDK_ROOT|ANDROID_NDK_ROOT)=' || true
          echo "Godot settings file:"
          cat "$SETTINGS"
          echo "Android export preset:"
          sed -n '1,100p' export_presets.cfg

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --verbose --path . --export-debug "Android" build/PixelDungeon.apk 2>&1 | tee build/export.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDungeon-Android-APK
          path: build/PixelDungeon.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload export log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-export-diagnostics
          path: build/export.log
          if-no-files-found: warn
          retention-days: 7
