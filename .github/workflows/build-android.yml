name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot Android environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
          touch ~/.config/godot/editor_settings-4.3.tres
          if ! grep -q '^export/android/java_sdk_path' ~/.config/godot/editor_settings-4.3.tres; then
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.3.tres
          fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PixelDungeon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDungeon-Android-APK
          path: build/PixelDungeon.apk
          if-no-files-found: error
          retention-days: 14
