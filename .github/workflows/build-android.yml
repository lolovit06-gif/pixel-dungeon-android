name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Diagnose Android build environment
        shell: bash
        run: |
          set -eu
          echo "===== Environment ====="
          echo "HOME=$HOME"
          id
          echo "===== Java ====="
          command -v java || true
          java -version || true
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if [ -n "${JAVA_HOME:-}" ]; then ls -ld "$JAVA_HOME" || true; fi
          echo "===== Android SDK environment variables ====="
          env | sort | grep -E '^(ANDROID|JAVA_HOME|HOME)=' || true
          echo "===== Common SDK directories ====="
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /opt/android-sdk /opt/android-sdk-linux /usr/lib/android-sdk /root/Android/Sdk "$HOME/Android/Sdk"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              echo "FOUND SDK DIR: $d"
              ls -la "$d" | head -40
              for f in platforms platform-tools build-tools; do
                if [ -d "$d/$f" ]; then echo "--- $d/$f"; ls -la "$d/$f" | head -25; fi
              done
            fi
          done
          echo "===== Godot settings locations ====="
          for d in /root/.config/godot "$HOME/.config/godot"; do
            if [ -d "$d" ]; then echo "--- $d"; find "$d" -maxdepth 2 -type f -print; fi
          done
          echo "===== Export templates ====="
          find /root/.local/share/godot/export_templates "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -print 2>/dev/null | head -80 || true
          echo "===== ADB ====="
          command -v adb || true
          adb version || true
          adb devices || true
          echo "===== Godot version ====="
          godot --version

      - name: Prepare Godot settings
        shell: bash
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.config/godot ] && [ "$HOME/.config/godot" != "/root/.config/godot" ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          if [ -d /root/.local/share/godot/export_templates ] && [ "$HOME/.local/share/godot/export_templates" != "/root/.local/share/godot/export_templates" ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          if ! grep -q '^export/android/java_sdk_path' "$SETTINGS"; then
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi
          echo "===== Active Godot settings ====="
          cat "$SETTINGS"

      - name: Validate Android export preset
        shell: bash
        run: |
          set -eu
          mkdir -p build
          godot --headless --editor --path . --quit 2>&1 | tee build/editor-validation.log
          echo "===== Godot Android export configuration check ====="
          godot --headless --verbose --path . --export-debug "Android" build/PixelDungeon.apk 2>&1 | tee build/export.log
          test -s build/PixelDungeon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelDungeon-Android-APK
          path: build/PixelDungeon.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-export-diagnostics
          path: |
            build/export.log
            build/editor-validation.log
          if-no-files-found: warn
          retention-days: 7
